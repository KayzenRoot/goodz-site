name: GOODZ Quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Compile all Python
        run: python -m compileall -q app
