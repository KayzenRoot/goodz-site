services:
  site:
    build: .
    restart: unless-stopped
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      GOODZ_DATA_DIR: /app/data
    volumes:
      - goodz_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  goodz_data:
