# Install in the host nginx HTTP context after provisioning the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name site.example.invalid;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://site.example.invalid$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name site.example.invalid;
    ssl_certificate /etc/letsencrypt/live/site.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 9m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host site.example.invalid;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
